name: Test All

on:
  workflow_dispatch:

jobs:
  test:
    name: Test All
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Cache Foundry
        uses: actions/cache@v4
        id: cache-foundry
        with:
          path: ~/.foundry
          key: foundry-${{ runner.os }}
          restore-keys: |
            foundry-${{ runner.os }}-
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1
      - name: Test
        run: pnpm test:all
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}

